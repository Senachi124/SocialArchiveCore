name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_publication.py
      - run: python scripts/check_publication.py

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [instagram, twitter]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./packages/${{ matrix.package }} build
      - name: Offline regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/core-tests"
          export TMPDIR="$RUNNER_TEMP/core-tests"
          export XLOADER_TEST_TMP="$RUNNER_TEMP/core-tests"
          python -m unittest discover -s packages/${{ matrix.package }}/tests -v
      - run: python -m build --outdir dist/${{ matrix.package }} packages/${{ matrix.package }}
